apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: mesa-food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin
          image: nasirbloch323/mesa-food-admin:task10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: mesa-food
spec:
  selector:
    app: admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
