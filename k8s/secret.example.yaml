# Example only. Replace every CHANGE_ME value before applying.
# For real deployments prefer: kubectl create secret generic mesa-secret --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: mesa-secret
  namespace: mesa-food
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: "CHANGE_ME_mongo_admin"
  MONGO_ROOT_PASSWORD: "CHANGE_ME_use_a_long_random_password"
  MONGO_URL: "mongodb://CHANGE_ME_mongo_admin:CHANGE_ME_use_a_long_random_password@mongodb:27017/food-delivery?authSource=admin"
  JWT_SECRET: "CHANGE_ME_use_a_long_random_jwt_secret"
  STRIPE_SECRET_KEY: "CHANGE_ME_stripe_secret_key"
