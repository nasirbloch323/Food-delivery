apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: mesa-food
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-frontend
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: frontend
          image: nasirbloch323/mesa-food-frontend:task10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: mesa-food
spec:
  selector:
    app: customer-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
