# Configure Nginx to serve the static app and proxy API calls to Express.
server {
    # Listen on the HTTP port inside the frontend container.
    listen 80;
    # Accept requests for any host name.
    server_name _;
    # Set the directory containing the website assets.
    root /usr/share/nginx/html;
    # Use index.html for the website root.
    index index.html;

    # Serve static files and fall back to the main page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the backend service on the Compose network.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}